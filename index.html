<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>온돌컴퍼니 · 숀생님</title>
<meta name="description" content="온돌컴퍼니와 숀생님 — 들어갈 페이지를 선택하세요.">
<meta property="og:title" content="온돌컴퍼니 · 숀생님">
<meta property="og:description" content="Heart over hype. 온돌컴퍼니 또는 숀생님 페이지로 이동하세요.">
<meta property="og:image" content="assets/logo-og.png">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="assets/emblem.png">
<link rel="stylesheet" href="assets/ondol.css">
<style>
html, body { height: 100%; }
body { overflow: hidden; }

.split { position: relative; display: flex; height: 100vh; height: 100dvh; }

.panel {
  position: relative; flex: 1 1 50%; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  color: var(--txt-on-dark); text-align: center; isolation: isolate;
}
.panel:hover, .panel:focus-visible { color: var(--txt-on-dark); }
.panel:focus-visible { outline: 2px solid var(--gold); outline-offset: -6px; }

/* 배경 레이어 */
.panel .bg {
  position: absolute; inset: 0; z-index: -2;
  transition: transform 0.9s cubic-bezier(.2,.7,.2,1);
}
.panel .shade {
  position: absolute; inset: 0; z-index: -1;
  transition: opacity 0.5s ease;
}
.panel:hover .bg, .panel:focus-visible .bg { transform: scale(1.05); }
.panel:hover .shade, .panel:focus-visible .shade { opacity: 0.7; }

/* 왼쪽: 온돌컴퍼니 */
.panel-ondol .bg {
  background:
    radial-gradient(ellipse 70% 55% at 50% 110%, rgba(232, 80, 42, 0.28), transparent 70%),
    var(--ink);
}
.panel-ondol .emblem-bg {
  position: absolute; left: 50%; top: 50%; width: min(70%, 520px); aspect-ratio: 1;
  transform: translate(-50%, -50%); opacity: 0.07; z-index: -1;
  background: url('assets/emblem.png') center / contain no-repeat;
}
.panel-ondol .shade { background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.35)); }

/* 오른쪽: 숀쌤 — 칠판 그린 */
.panel-shawn .bg {
  background:
    radial-gradient(ellipse 75% 60% at 50% 45%, rgba(40, 66, 60, 0.9), transparent 75%),
    radial-gradient(ellipse 80% 50% at 50% 110%, rgba(224, 168, 60, 0.16), transparent 70%),
    #0F1A18;
}
.panel-shawn .shade { background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.35)); }
.panel-shawn .panel-eyebrow { color: #E6C98A; }
.shawn-badge {
  width: clamp(200px, 24vw, 320px); height: auto; margin: 0 auto 26px;
  filter: drop-shadow(0 24px 50px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 40px rgba(230, 201, 138, 0.12));
  transition: transform 0.6s cubic-bezier(.2,.7,.2,1);
}
.panel-shawn:hover .shawn-badge, .panel-shawn:focus-visible .shawn-badge { transform: translateY(-4px) scale(1.02); }

/* 가운데 구분선 */
.split::after {
  content: ''; position: absolute; left: 50%; top: 12%; bottom: 12%; width: 1px;
  background: linear-gradient(180deg, transparent, var(--gold), transparent); opacity: 0.45;
  pointer-events: none;
}

.panel-inner { padding: 40px 28px; max-width: 420px; }
.panel-logo { width: 96px; height: 96px; margin: 0 auto 34px; }
.panel-eyebrow {
  font-family: var(--serif-en); font-size: 12px; letter-spacing: 0.32em; color: var(--gold);
}
.panel-title {
  margin-top: 14px; font-family: var(--serif-en); font-weight: 500;
  font-size: clamp(30px, 3.6vw, 50px); line-height: 1.2; letter-spacing: 0.06em;
}
.panel-title.kr { font-family: var(--serif-kr); font-weight: 700; letter-spacing: 0.02em; }
.panel-sub {
  margin-top: 14px; font-family: var(--serif-kr); font-size: 17px; color: var(--txt-dark-muted);
}
.panel-cta {
  display: inline-flex; align-items: center; gap: 10px; margin-top: 38px;
  padding: 13px 26px; border: 1px solid var(--ink-line); border-radius: 999px;
  font-size: 14px; font-weight: 600; letter-spacing: 0.06em;
  background: rgba(246, 240, 230, 0.04);
  transition: transform 0.25s ease, background-color 0.25s ease, border-color 0.25s ease;
}
.panel-cta .arrow { display: inline-block; transition: transform 0.25s ease; }
.panel:hover .panel-cta, .panel:focus-visible .panel-cta {
  background-color: var(--ember); border-color: var(--ember); color: var(--ink); transform: scale(1.02);
}
.panel:hover .panel-cta .arrow { transform: translateX(4px); }
.panel:active .panel-cta { transform: scale(0.98); }

/* 모바일: 위/아래 50%씩 */
@media (max-width: 760px) {
  .shawn-badge { width: 150px; margin-bottom: 14px; }
  .split { flex-direction: column; }
  .split::after {
    left: 12%; right: 12%; top: 50%; bottom: auto; width: auto; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .panel-logo { width: 64px; height: 64px; margin-bottom: 20px; }
  .panel-sub { font-size: 15px; }
  .panel-cta { margin-top: 24px; padding: 11px 22px; }
}

@media (prefers-reduced-motion: reduce) {
  .panel .bg, .panel .shade, .shawn-badge, .panel-cta, .panel-cta .arrow { transition: none; }
}
</style>
</head>
<body>
<main class="split">
  <a class="panel panel-ondol" href="ondol.html" aria-label="온돌컴퍼니 페이지로 이동">
    <div class="bg"></div>
    <div class="emblem-bg" aria-hidden="true"></div>
    <div class="shade"></div>
    <div class="panel-inner">
      <img class="panel-logo" src="assets/emblem.png" alt="">
      <p class="panel-eyebrow">HEART OVER HYPE</p>
      <h1 class="panel-title">ONDOL<br>COMPANY</h1>
      <p class="panel-sub">온돌컴퍼니</p>
      <span class="panel-cta">들어가기 <span class="arrow">→</span></span>
    </div>
  </a>

  <a class="panel panel-shawn" href="shawn.html" aria-label="숀생님 페이지로 이동">
    <div class="bg"></div>
    <div class="shade"></div>
    <div class="panel-inner">
      <img class="shawn-badge" src="assets/shawn/profile.png" alt="숀쌤 SHAWNSANGNIM 프로필">
      <p class="panel-eyebrow">TEACHER · SPEAKER</p>
      <h2 class="panel-title kr">숀생님</h2>
      <span class="panel-cta">들어가기 <span class="arrow">→</span></span>
    </div>
  </a>
</main>
</body>
</html>
